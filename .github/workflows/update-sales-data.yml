name: Update public sales sample

on:
  repository_dispatch:
    types: [sales-data-updated]

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out demo
        uses: actions/checkout@v4

      - name: Write safe sample data
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const input = JSON.parse(process.env.CLIENT_PAYLOAD || '{}');
          if (!Array.isArray(input.rows)) throw new Error('Expected client_payload.rows to be an array');
          const rows = input.rows.slice(0, 10).map((row) => {
            const get = (name) => row[name] ?? row[name.toLowerCase()] ?? '';
            const rawSales = get('Sales');
            const sales = typeof rawSales === 'number'
              ? rawSales
              : Number(String(rawSales).replace(/[$,]/g, ''));
            if (!Number.isFinite(sales)) throw new Error('A row has an invalid Sales value');
            return {
              date: String(get('Date')),
              product: String(get('Product')),
              region: String(get('Region')),
              sales
            };
          });
          const updatedAt = input.updatedAt || new Date().toISOString();
          fs.writeFileSync('data.json', JSON.stringify({ updatedAt, rows }, null, 2) + '\n');
          NODE

      - name: Commit updated sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update sales demo data"
            git push
          fi
